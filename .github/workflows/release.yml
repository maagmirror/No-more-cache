name: Package extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Chrome package
        run: |
          cp manifest.chrome.json manifest.json

          zip -j no-more-cache-chrome.zip \
            manifest.json \
            background.chrome.js \
            popup.html \
            popup.js \
            icon16.png \
            icon32.png \
            icon48.png \
            icon128.png

          rm manifest.json

      - name: Build Firefox package
        run: |
          cp manifest.firefox.json manifest.json

          zip -j no-more-cache-firefox.zip \
            manifest.json \
            background.firefox.js \
            popup.html \
            popup.js \
            icon16.png \
            icon32.png \
            icon48.png \
            icon128.png

          rm manifest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            no-more-cache-chrome.zip
            no-more-cache-firefox.zip
